# Deployment example for local development
services:
  pmp:
    build:
      context: ../../
      dockerfile: deployment/docker/Dockerfile
      args:
        - BUILD_ENV=localbuild
    depends_on:
      - db
      - cerbos
    ports:
      - 8090:8080
    environment:
      - PMP_DB_URL=db
      - PMP_DB_USER=postgres
      - PMP_DB_PASSWORD=postgres
      - PMP_DB_NAME=pmp_db_local
      - PMP_CERBOS_URL=http://cerbos:3592
      - PMP_CERBOS_USER=cerbos_user
      - PMP_DB_PORT=5432
      - PMP_CERBOS_PASSWORD=changeme
      - PMP_MIGRATE_DB_ON_STARTUP=true
      - JWT_VALID_ISSUER=validIssue
      - JWT_VALID_AUDIENCE=validAudience
      - JWT_ISSUER_SIGNING_KEY=superSecretKeyThatIsAtLeast257BitLong@345
      - REFRESH_TOKEN_EXPIRATION_HOURS=6
      - ACCESS_TOKEN_EXPIRATION_MINUTES=15

    networks:
      - pmp-local

  db:
    image: postgres:18
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=pmp_db_local
    ports:
      - 5432:5432
    volumes:
      - db_data:/var/lib/postgresql
    networks:
      - pmp-local

  cerbos:
    image: ghcr.io/cerbos/cerbos:latest
    ports:
      - "3592:3592"
      - "3593:3593"
    command:
      - server
      - --set=storage.driver=disk
      - --set=storage.disk.directory=policies
      - --set=storage.disk.watchForChanges=true
      - --set=server.adminAPI.enabled=true
      - --set=server.adminAPI.adminCredentials.username=cerbos_user
      - --set=server.adminAPI.adminCredentials.passwordHash=JDJ5JDEwJHl2ZjJJRERFS3VES2FTcExZU2xacmU5a1lLZHA0Z2FnL2c4VU8yaTguZnpacUo3emozSk4yCgo=
    volumes:
      - type: bind
        source: ./cerbos/policies
        target: /policies

volumes:
  db_data:

networks:
  pmp-local:
    driver: bridge
